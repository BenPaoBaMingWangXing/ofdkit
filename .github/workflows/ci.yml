name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: moon version

      - name: Update registry index
        run: moon update

      - name: Build
        run: moon build

      - name: Test
        run: moon test

      - name: Generate demo package
        run: |
          mkdir -p out
          moon run cmd/main -- demo out/demo.ofd

      - name: Self check
        run: moon run cmd/main -- verify out/demo.ofd

      - name: Independent structural check
        run: python3 scripts/verify_ofd.py out/demo.ofd

      - name: Compressed entries decode with zlib
        run: |
          python3 - <<'PY'
          # testzip() inflates every entry with CPython's zlib and checks the
          # CRC, so this is a real interoperability check for our encoder.
          import zipfile
          z = zipfile.ZipFile("out/demo.ofd")
          assert z.testzip() is None, "a deflate entry did not decode"
          deflated = [i for i in z.infolist() if i.compress_type == 8]
          assert deflated, "nothing was compressed; the deflate path is dead code"
          print(f"{len(deflated)} deflate entries decoded by CPython zlib")
          PY

      - name: Preview renderer
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/preview_ofd.py out/demo.ofd preview.png 0

      - name: Font embedding path
        run: |
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          if [ -f "$FONT" ]; then
            moon run cmd/main -- demo out/demo-font.ofd "$FONT"
            moon run cmd/main -- verify out/demo-font.ofd
            python3 scripts/verify_ofd.py out/demo-font.ofd
          else
            echo "no system TrueType font found, skipping font embedding check"
          fi

      - name: Image embedding path
        run: |
          python3 - <<'PY'
          import base64
          # 1x1 transparent PNG
          data = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          )
          open("out/seal.png", "wb").write(data)
          PY
          moon run cmd/main -- demo out/demo-image.ofd out/seal.png
          moon run cmd/main -- verify out/demo-image.ofd
          python3 scripts/verify_ofd.py out/demo-image.ofd
